[package]
name = "oneup-shellext"
version = "0.1.0"
publish = false
description = "OneUpDrive's File Explorer commands (a COM shell extension; it only starts oneup.exe)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "oneup_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
# For `fold`: paths compare as the engine compares names. Pure, no I/O.
oneup-sync = { path = "../oneup-sync" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Storage_Provider",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[target.'cfg(windows)'.dependencies.windows-collections]
version = "0.3"

[lints]
workspace = true
