[package]
name = "oneup-graph"
version = "0.1.0"
publish = false
description = "Microsoft Graph client for OneUpDrive: auth, throttling-aware requests, drive item model"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
# Push notifications (`push`): WebSocket over rustls, trusting Windows' own
# certificate store.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.3"
oneup-sys = { path = "../oneup-sys" }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
