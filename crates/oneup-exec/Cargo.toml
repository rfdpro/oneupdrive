[package]
name = "oneup-exec"
version = "0.1.0"
publish = false
description = "OneUpDrive's executor: runs gate-approved operations through the effects layer and the cloud, and records the outcome"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
oneup-cfapi = { path = "../oneup-cfapi" }
oneup-effects = { path = "../oneup-effects" }
oneup-gate = { path = "../oneup-gate" }
oneup-graph = { path = "../oneup-graph" }
oneup-hash = { path = "../oneup-hash" }
oneup-local = { path = "../oneup-local" }
oneup-remote = { path = "../oneup-remote" }
oneup-rules = { path = "../oneup-rules" }
oneup-store = { path = "../oneup-store" }
oneup-sync = { path = "../oneup-sync" }
# Fingerprints of what a user's answer concerns (`resolve`).
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
# Only for the test helper below (feature `test-helpers`).
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[[bin]]
# Test-only: a program of its own that writes SQLite databases while
# tests/sync.rs syncs them (AGENTS.md: a different executable from the
# test). Built only with `test-helpers`, which the tests turn on.
name = "oneup-test-sqlite"
path = "src/bin/oneup-test-sqlite.rs"
required-features = ["test-helpers"]
test = false

[features]
# Test-only: `Executor::crash_after` stops a round as if the process had
# been killed, between effects and records and inside effects, and
# `Executor::on_blocking` holds work on its blocking thread as a slow
# disk would (tests/sync.rs turns it on; production builds never do).
crash-test = ["oneup-effects/crash-test"]
test-helpers = ["dep:rusqlite"]

[dev-dependencies]
oneup-exec = { path = ".", features = ["crash-test", "test-helpers"] }
rusqlite = { version = "0.40", features = ["bundled"] }
oneup-cfapi = { path = "../oneup-cfapi" }
# The event hooks' burst test and benchmark (tests/sync.rs).
oneup-hooks = { path = "../oneup-hooks" }
oneup-ipc = { path = "../oneup-ipc" }
oneup-plan = { path = "../oneup-plan" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "test-util", "net", "io-util"] }

[lints]
workspace = true
