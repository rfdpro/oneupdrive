[package]
name = "oneup-ntfs"
version = "0.1.0"
publish = false
description = "NTFS/ReFS change-journal reading and fast directory enumeration for OneUpDrive"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
]

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
