[package]
name = "oneup-remote"
version = "0.1.0"
publish = false
description = "OneUpDrive's Remote tree: initial enumeration, junk pruning, incremental catch-up"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
oneup-graph = { path = "../oneup-graph" }
oneup-rules = { path = "../oneup-rules" }
oneup-store = { path = "../oneup-store" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
