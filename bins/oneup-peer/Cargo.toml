[package]
name = "oneup-peer"
version = "0.1.0"
description = "OneUpDrive peer sharing and standalone receiver"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "oneup-receive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-aws-lc-rs"] }
iroh-blobs = { version = "=0.105.0", default-features = false, features = ["fs-store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
oneup-cfapi = { path = "../../crates/oneup-cfapi" }
oneup-ntfs = { path = "../../crates/oneup-ntfs" }
oneup-sys = { path = "../../crates/oneup-sys" }

[lints]
workspace = true
