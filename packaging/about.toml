# cargo-about configuration for THIRD-PARTY-NOTICES.txt (see packaging/about.hbs).
# Regenerate after changing dependencies:
#   cargo about generate -c packaging/about.toml packaging/about.hbs -o THIRD-PARTY-NOTICES.txt
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# OneUpDrive's own crates (publish = false) are not third-party.
[private]
ignore = true
