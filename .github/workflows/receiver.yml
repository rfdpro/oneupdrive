name: Build OneUp Receive

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  receiver:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: oneup-receive.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: oneup-receive
            archive: oneup-receive-linux-x64.tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            executable: oneup-receive
            archive: oneup-receive-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Test and build receiver
        shell: bash
        run: |
          cargo test --locked -p oneup-peer --target '${{ matrix.target }}'
          cargo build --locked --release -p oneup-peer --target '${{ matrix.target }}'
      - name: Assemble receiver
        shell: bash
        run: |
          mkdir -p target/receiver
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" target/receiver/
          cp LICENSE target/receiver/
          cargo about generate --locked --fail --manifest-path bins/oneup-peer/Cargo.toml \
            --target '${{ matrix.target }}' -c packaging/about.toml packaging/about.hbs \
            -o target/receiver/THIRD-PARTY-NOTICES.txt
      - name: Archive Unix receiver
        if: matrix.archive != ''
        run: tar -czf 'target/${{ matrix.archive }}' -C target/receiver oneup-receive LICENSE THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oneup-receive-${{ matrix.target }}
          path: ${{ matrix.archive && format('target/{0}', matrix.archive) || 'target/receiver' }}
          if-no-files-found: error
